<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- No user-scalable=no here on purpose — pinch-zoom (mobile) and
     ctrl/trackpad zoom (desktop) must always work, even though mobile's
     swipe navigation still locks ordinary page *scroll* (see the
     max-width:768px block below). Zoom and scroll are separate browser
     mechanisms; restricting one never requires restricting the other. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
<script src="../../shared/app-shell.js"></script>
<style>
:root {
  --black:      #0A0A0A;
  --gray-dark:  #555555;
  --gray-mid:   #999999;
  --gray-faint: #E8E8E8;
  --white:      #FAFAFA;
  --font-display: "Cormorant Garamond", Georgia, serif;
  --font-body:    "Inter", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--black); font-family: var(--font-body); }

/* Mobile (≤768px, matching the breakpoint amelia-arabe-portfolio.html
   already uses): the full-screen swipe carousel locks ordinary page
   scroll, since swiping IS the navigation here — there's nothing else on
   the page to scroll to. Desktop instead scrolls normally (hero, then a
   summary below it), so the lock is scoped to mobile only. */
@media (max-width: 768px) {
  html, body {
    height: 100%; overflow: hidden;
    overscroll-behavior: none; /* stops iOS/Android's own pull/bounce from fighting the swipe */
  }
}

/* ── NOT FOUND ──────────────────────────────────── */
#not-found {
  display: none; position: fixed; inset: 0; z-index: 50;
  align-items: center; justify-content: center; flex-direction: column; gap: 10px;
  background: var(--white); color: var(--black); text-align: center; padding: 24px;
}
#not-found.visible { display: flex; }
#not-found h1 { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin: 0; }
#not-found a { color: var(--gray-dark); font-size: 13px; text-decoration: underline; }

/* ══════════════════════════════════════════════════════════════════════
   MOBILE — full-screen, one-photo-at-a-time swipe carousel.
   Shown ≤768px; #desktop-viewer (below) takes over above that.
   ══════════════════════════════════════════════════════════════════════ */
#viewer { display: none; position: fixed; inset: 0; }
@media (max-width: 768px) {
  #viewer.ready { display: block; }
}

/* One slide per photo, stacked vertically; #track is moved with a single
   transform instead of scrolling, so we control exactly how the "next
   photo" transition feels (see JS: TRANSITION_MS). 100svh (small viewport
   height) avoids the classic mobile-browser bug where 100vh includes space
   the address bar is about to cover or reveal. */
#track {
  width: 100%;
  transition: transform 550ms cubic-bezier(0.22, 0.61, 0.36, 1); /* the "slow" swipe transition */
}
#track.dragging { transition: none; } /* while a finger is down, follow it 1:1 — no lag, no overshoot */

.slide {
  position: relative;
  width: 100%;
  height: 100svh;
  height: 100vh; /* fallback for older browsers that don't know svh — the modern rule above overrides it where supported */
  overflow: hidden;
  background: var(--black);
}
.slide img {
  width: 100%; height: 100%; object-fit: cover; object-position: center;
  display: block; pointer-events: none; /* the slide itself owns the touch gesture, not the image */
}

/* ── CHROME (back link, slide label, progress dots) ────────────── */
.chrome {
  position: fixed; inset: 0; z-index: 10; pointer-events: none; /* click-through except for the controls below */
}
.chrome > * { pointer-events: auto; }

.back-link {
  position: absolute; top: max(18px, env(safe-area-inset-top)); left: 18px;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(10,10,10,0.45); backdrop-filter: blur(6px);
  color: var(--white); text-decoration: none; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
}

.slide-label {
  position: absolute; top: max(20px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  color: var(--white); font-family: var(--font-body); font-weight: 500; font-size: 11px;
  letter-spacing: 0.12em; text-transform: uppercase; text-shadow: 0 1px 6px rgba(0,0,0,0.5);
}

/* one dot per slide, current one taller — a literal position marker, since
   order is the whole point of this layout (see artifact-design "structure
   is information" — this isn't decoration) */
.progress {
  position: absolute; top: 50%; right: 12px; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 6px; align-items: center;
}
.progress .dot {
  width: 4px; height: 12px; border-radius: 2px;
  background: rgba(255,255,255,0.35);
  transition: height 250ms, background 250ms;
}
.progress .dot.active { height: 22px; background: var(--white); }

.swipe-hint {
  position: absolute; bottom: max(26px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
  color: var(--white); font-family: var(--font-body); font-weight: 400; font-size: 10.5px;
  letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.75;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  animation: hint-fade 4s ease forwards; /* only needed on first load — fades out on its own */
}
.swipe-hint .arrow { font-size: 16px; animation: hint-bob 1.6s ease-in-out infinite; }
@keyframes hint-fade { 0%, 60% { opacity: 0.75; } 100% { opacity: 0; visibility: hidden; } }
@keyframes hint-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
@media (prefers-reduced-motion: reduce) {
  .swipe-hint .arrow, .scroll-hint .chevron { animation: none; }
}

/* ── MEASUREMENTS PANEL ─────────────────────────────
   Shown only on the one slide with show_measurements=true — "stacked
   beside" the photo, per the brief. Sits along the right edge so it reads
   as a comp-card annotation, not a caption. */
.measurements {
  position: absolute; top: 50%; right: 14px; transform: translateY(-50%);
  background: rgba(10,10,10,0.55); backdrop-filter: blur(6px);
  padding: 16px 14px; border-radius: 3px;
  display: flex; flex-direction: column; gap: 10px;
  max-width: 118px;
}
.measurements .stat-label {
  font-family: var(--font-body); font-weight: 600; font-size: 8.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: rgba(255,255,255,0.55); margin-bottom: 1px;
}
.measurements .stat-value {
  font-family: var(--font-display); font-weight: 400; font-size: 15px; color: var(--white); font-style: italic;
}
.measurements .stat.empty { display: none; } /* a stat left blank in the studio just doesn't render, rather than showing a bare label */

/* ══════════════════════════════════════════════════════════════════════
   DESKTOP (≥769px) — a horizontally auto-scrolling "hero" filmstrip
   (click to pause/resume in place) with a normal, scrollable summary
   underneath. A completely different interaction model from mobile's
   swipe-lock, so it's a separate DOM subtree rather than a squeeze-fit of
   the same markup.
   ══════════════════════════════════════════════════════════════════════ */
#desktop-viewer { display: none; background: var(--white); min-height: 100vh; }
@media (min-width: 769px) {
  #viewer { display: none !important; } /* mobile carousel never renders at this width, ready or not */
  #desktop-viewer.ready { display: block; }
  /* mobile-only chrome has no meaning here */
  .slide-label, .progress, .swipe-hint { display: none !important; }
}

.hero-marquee {
  position: relative;
  width: 100%;
  height: 82vh; /* a deliberate peek of the summary below invites scrolling, rather than reading as the whole page */
  overflow: hidden;
  background: var(--black);
  cursor: pointer;
}
.hero-track {
  display: flex;
  height: 100%;
  width: max-content; /* sized by its own (doubled) image content, not the viewport */
  animation-name: marquee;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
  /* animation-duration is set from JS once the real image widths are
     known — see buildDesktopHero()'s speed calculation. This value is
     just a sane fallback before that measurement lands. */
  animation-duration: 60s;
}
.hero-marquee.paused .hero-track { animation-play-state: paused; }
.hero-track img {
  height: 100%; width: auto; /* natural aspect ratio — these are comp-card portraits, not a cropped strip */
  display: block; flex-shrink: 0;
  user-select: none; -webkit-user-drag: none; pointer-events: none;
}
/* the doubled image set loops seamlessly: translating exactly half the
   (now double-width) track's width is exactly one full original set's
   width, so frame N of the loop is pixel-identical to frame 0 */
@keyframes marquee {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
@media (prefers-reduced-motion: reduce) {
  .hero-track { animation-play-state: paused; } /* still clickable to play, just doesn't move on its own */
}

/* explicit feedback on click — a paused CSS animation looks identical to
   a broken one otherwise, and "nothing visibly happened" is exactly the
   confusion this page exists to avoid */
.hero-pause-indicator {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(10,10,10,0.18);
  color: var(--white); font-family: var(--font-body); font-weight: 500; font-size: 12px;
  letter-spacing: 0.16em; text-transform: uppercase;
  opacity: 0; transition: opacity 200ms ease; pointer-events: none;
}
.hero-marquee.paused .hero-pause-indicator { opacity: 1; }

.scroll-hint {
  position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
  color: var(--white); font-family: var(--font-body); font-weight: 400; font-size: 10px;
  letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.85;
  text-shadow: 0 1px 6px rgba(0,0,0,0.6); /* legible over a light-toned photo (or these placeholders), same as .slide-label */
  display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none;
}
.scroll-hint .chevron { font-size: 14px; animation: hint-bob 1.8s ease-in-out infinite; }

.summary {
  max-width: 640px; margin: 0 auto; padding: 72px 32px 110px; text-align: center;
}
.summary-eyebrow {
  font-family: var(--font-body); font-weight: 500; font-size: 11px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--gray-dark); margin-bottom: 10px;
}
.summary-title {
  font-family: var(--font-display); font-weight: 400; font-size: 44px; color: var(--black);
  line-height: 1.1; margin: 0 0 24px; text-wrap: balance;
}
.summary-desc {
  font-family: var(--font-body); font-weight: 400; font-size: 15px; line-height: 1.7;
  color: var(--gray-dark); margin: 0 0 20px; max-width: 52ch; margin-left: auto; margin-right: auto;
}
.summary-credits {
  font-family: var(--font-body); font-weight: 500; font-size: 11px; letter-spacing: 0.08em;
  color: var(--gray-mid); text-transform: uppercase;
}
</style>
</head>
<body>

<div id="not-found">
  <h1>Gallery not found</h1>
  <a href="../amelia-arabe-portfolio.html">&larr; Back to Portfolio</a>
</div>

<!-- MOBILE -->
<div id="viewer">
  <div id="track"></div>
  <div class="chrome">
    <a class="back-link" id="back-link" href="../amelia-arabe-portfolio.html" aria-label="Back to Portfolio">&larr;</a>
    <div class="slide-label" id="slide-label"></div>
    <div class="progress" id="progress"></div>
    <div class="swipe-hint" id="swipe-hint"><span class="arrow">&uarr;</span>Swipe</div>
  </div>
</div>

<!-- DESKTOP -->
<div id="desktop-viewer">
  <a class="back-link" id="back-link-desktop" href="../amelia-arabe-portfolio.html" aria-label="Back to Portfolio" style="position:fixed;z-index:10;"></a>
  <div class="hero-marquee" id="hero-marquee" role="img" aria-label="Auto-scrolling photo gallery — click to pause or resume">
    <div class="hero-track" id="hero-track"></div>
    <div class="hero-pause-indicator" id="hero-pause-indicator">Paused — click to resume</div>
    <div class="scroll-hint"><span>Scroll for more</span><span class="chevron">&darr;</span></div>
  </div>
  <div class="summary">
    <div class="summary-eyebrow" id="d-category"></div>
    <h1 class="summary-title" id="d-title"></h1>
    <p class="summary-desc" id="d-desc"></p>
    <div class="summary-credits" id="d-credits"></div>
  </div>
</div>

<script>
// ── FULL-SCREEN MODEL GALLERY ──────────────────────────────────────────
// Two completely different viewers for the same display_mode='gallery'
// project data, switched by CSS media query (≤768px vs ≥769px, matching
// amelia-arabe-portfolio.html's own breakpoint):
//
//   MOBILE  (#viewer)          — one photo fills the screen at a time; a
//                                 vertical swipe moves to the next/previous
//                                 one with a deliberately slow transition;
//                                 ordinary page scroll is disabled, since
//                                 swiping IS the navigation.
//   DESKTOP (#desktop-viewer)  — a horizontally auto-scrolling "hero"
//                                 filmstrip (click pauses/resumes it in
//                                 place) with a normal-flow summary
//                                 underneath, reached by scrolling down.
//
// Both are built from the same fetched project row; only one is ever
// visible at a time (see the CSS above), so building both costs nothing
// the visitor notices. Pinch/trackpad zoom is left alone in both modes —
// see the viewport meta tag's comment.
//
// sb / esc / getProfileByHandle / currentHandle come from shared/app-shell.js

const id = new URLSearchParams(window.location.search).get('id');
const from = new URLSearchParams(window.location.search).get('from');
const isolated = new URLSearchParams(window.location.search).get('share') === '1';

// Same handle-aware "Back to Portfolio" construction as case-study.html —
// duplicated rather than shared because these are two independent static
// pages with no module system between them (see shared/app-shell.js's own
// header note on why this app has no build step).
function backHrefWithHandle(handle) {
  let href = from ? '../amelia-arabe-portfolio.html' + (isolated ? `?share=${from}` : `#${from}`) : '../amelia-arabe-portfolio.html';
  if (handle && handle !== 'amelia-arabe') {
    const sep = href.includes('?') ? '&' : '?';
    const hashIdx = href.indexOf('#');
    href = hashIdx === -1 ? `${href}${sep}u=${encodeURIComponent(handle)}`
      : `${href.slice(0, hashIdx)}${sep}u=${encodeURIComponent(handle)}${href.slice(hashIdx)}`;
  }
  return href;
}

// image_url is stored relative to the repo root — this file lives two
// levels down (app/templates/), so local paths need '../../' prepended.
// External URLs pass through unchanged.
function resolveImageUrl(url) {
  if (!url) return '';
  return /^https?:\/\//.test(url) ? url : '../../' + url;
}

function showNotFound() {
  document.getElementById('not-found').classList.add('visible');
}

// ── SLIDE STATE ──────────────────────────────────────────────────────
let slides = [];       // [{label, image_url, show_measurements}]
let measurements = {}; // {height, bust, cup, waist, hips, shoe_size, hair_color, eye_color}
let current = 0;

const track = document.getElementById('track');

function render(project) {
  const owner = project.profiles || {};
  document.title = (project.title || 'Gallery') + ' — ' + (owner.display_name || 'Amelia Arabe');
  document.getElementById('back-link').href = backHrefWithHandle(owner.handle);
  document.getElementById('back-link-desktop').href = backHrefWithHandle(owner.handle);
  document.getElementById('back-link-desktop').innerHTML = '&larr;';

  slides = Array.isArray(project.model_slides) ? project.model_slides : [];
  measurements = project.measurements || {};

  if (!slides.length) { showNotFound(); return; }

  buildMobileTrack();
  buildProgressDots();
  goTo(0, false);
  buildDesktopHero();
  fillDesktopSummary(project);

  document.getElementById('viewer').classList.add('ready');
  document.getElementById('desktop-viewer').classList.add('ready');
}

// Build the mobile track: one <section class="slide"> per photo. Built
// once, from trusted-shape data (jsonb from our own table) — but every
// piece of text still goes through esc()/textContent, never a raw
// template string into innerHTML, since this project's data can be
// edited by whoever owns the portfolio, not just Amelia, once other
// Muses use this same template for their own galleries.
function buildMobileTrack() {
  const frag = document.createDocumentFragment();
  slides.forEach((slide, i) => {
    const section = document.createElement('section');
    section.className = 'slide';

    const img = document.createElement('img');
    img.src = resolveImageUrl(slide.image_url);
    img.alt = esc(slide.label || `Photo ${i + 1}`);
    img.loading = i === 0 ? 'eager' : 'lazy';
    section.appendChild(img);

    if (slide.show_measurements) {
      section.appendChild(buildMeasurementsPanel());
    }

    frag.appendChild(section);
  });
  track.innerHTML = '';
  track.appendChild(frag);
}

function buildMeasurementsPanel() {
  const panel = document.createElement('div');
  panel.className = 'measurements';
  const rows = [
    ['Height', measurements.height],
    ['Bust', measurements.bust],
    ['Cup', measurements.cup],
    ['Waist', measurements.waist],
    ['Hips', measurements.hips],
    ['Shoe', measurements.shoe_size],
    ['Hair', measurements.hair_color],
    ['Eyes', measurements.eye_color],
  ];
  rows.forEach(([label, value]) => {
    const row = document.createElement('div');
    row.className = 'stat' + (value ? '' : ' empty'); // blank fields in the studio just don't render
    const l = document.createElement('div');
    l.className = 'stat-label';
    l.textContent = label;
    const v = document.createElement('div');
    v.className = 'stat-value';
    v.textContent = value || '';
    row.appendChild(l);
    row.appendChild(v);
    panel.appendChild(row);
  });
  return panel;
}

function buildProgressDots() {
  const el = document.getElementById('progress');
  el.innerHTML = '';
  slides.forEach(() => {
    const dot = document.createElement('div');
    dot.className = 'dot';
    el.appendChild(dot);
  });
}

// ── MOBILE NAVIGATION ───────────────────────────────────────────────
function goTo(index, animate) {
  current = Math.max(0, Math.min(slides.length - 1, index));
  track.classList.toggle('dragging', animate === false);
  track.style.transform = `translateY(-${current * 100}svh)`;
  document.getElementById('slide-label').textContent = esc(slides[current].label || '');
  document.querySelectorAll('.progress .dot').forEach((d, i) => d.classList.toggle('active', i === current));
  // the "swipe to browse" hint only makes sense before anyone has swiped
  if (current !== 0) {
    const hint = document.getElementById('swipe-hint');
    if (hint) hint.style.display = 'none';
  }
}

// ── TOUCH SWIPE — the core mobile interaction ─────────────────────────
// Vertical drag follows the finger 1:1 while it's down (no transition —
// see #track.dragging), then either commits to the next/previous slide or
// snaps back, both through the slow CSS transition defined above.
let touchStartY = null;
let dragOffsetSvh = 0; // current drag distance, expressed in svh units so it matches goTo()'s units

function svh() { return window.innerHeight / 100; }

function onDragStart(y) {
  touchStartY = y;
  track.classList.add('dragging');
}
function onDragMove(y) {
  if (touchStartY === null) return;
  const deltaPx = y - touchStartY;
  dragOffsetSvh = deltaPx / svh();
  track.style.transform = `translateY(${-(current * 100) + dragOffsetSvh * 1}svh)`;
}
function onDragEnd() {
  if (touchStartY === null) return;
  track.classList.remove('dragging');
  const THRESHOLD_SVH = 12; // roughly an eighth of a screen height — a deliberate swipe, not a jitter
  if (dragOffsetSvh < -THRESHOLD_SVH) goTo(current + 1);
  else if (dragOffsetSvh > THRESHOLD_SVH) goTo(current - 1);
  else goTo(current); // snap back to where we were
  touchStartY = null;
  dragOffsetSvh = 0;
}

document.getElementById('viewer').addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return; // a second finger means pinch-zoom, not a swipe — leave it to the browser
  onDragStart(e.touches[0].clientY);
}, { passive: true });
document.getElementById('viewer').addEventListener('touchmove', e => {
  if (e.touches.length !== 1) return; // ditto — never preventDefault a pinch gesture
  onDragMove(e.touches[0].clientY);
  e.preventDefault();
}, { passive: false });
document.getElementById('viewer').addEventListener('touchend', onDragEnd);
document.getElementById('viewer').addEventListener('touchcancel', onDragEnd);

// Mouse-drag/wheel/arrow-key fallbacks so the mobile viewer isn't
// unusable if it's ever previewed on a narrow desktop window — the
// ≥769px breakpoint hides #viewer entirely on real desktop, where the
// hero/summary view below takes over instead.
let mouseDown = false;
document.getElementById('viewer').addEventListener('mousedown', e => { mouseDown = true; onDragStart(e.clientY); });
window.addEventListener('mousemove', e => { if (mouseDown) onDragMove(e.clientY); });
window.addEventListener('mouseup', () => { if (mouseDown) { mouseDown = false; onDragEnd(); } });

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') goTo(current + 1);
  if (e.key === 'ArrowUp') goTo(current - 1);
});

let wheelLock = false;
document.getElementById('viewer').addEventListener('wheel', e => {
  e.preventDefault();
  if (wheelLock) return;
  wheelLock = true;
  goTo(current + (e.deltaY > 0 ? 1 : -1));
  setTimeout(() => { wheelLock = false; }, 550); // matches the CSS transition length — one slide per gesture
}, { passive: false });

// ── DESKTOP HERO — auto-scrolling filmstrip ───────────────────────────
// The image set is rendered twice, back-to-back, and the track animates
// from translateX(0) to translateX(-50%) on a linear infinite loop — at
// the halfway point the doubled track is pixel-identical to its start, so
// the loop is seamless with no jump-cut or reset.
function buildDesktopHero() {
  const heroTrack = document.getElementById('hero-track');
  heroTrack.innerHTML = '';
  const doubled = slides.concat(slides);
  doubled.forEach(slide => {
    const img = document.createElement('img');
    img.src = resolveImageUrl(slide.image_url);
    img.alt = esc(slide.label || '');
    img.draggable = false;
    heroTrack.appendChild(img);
  });

  // Speed the animation to the actual rendered width so a short project
  // (fewer/narrower slides) drifts at the same visual pace as a long one,
  // rather than a fixed duration making it look faster or slower. Needs
  // every image loaded first — before that, scrollWidth is unreliable.
  const imgs = Array.from(heroTrack.querySelectorAll('img'));
  Promise.all(imgs.map(img => new Promise(resolve => {
    if (img.complete) resolve();
    else { img.onload = resolve; img.onerror = resolve; }
  }))).then(() => {
    const oneSetWidth = heroTrack.scrollWidth / 2; // the doubled track, halved back to one real set
    const PX_PER_SECOND = 28; // deliberately unhurried — a slow drift, not a ticker
    const duration = Math.max(oneSetWidth / PX_PER_SECOND, 25); // floor keeps a short (few-slide) project from whipping past
    heroTrack.style.animationDuration = duration + 's';
  });
}

// Click anywhere on the hero to pause it in place (CSS animation-play-state
// natively freezes mid-transform and resumes from exactly there — no
// manual position bookkeeping needed) — click again to resume.
document.getElementById('hero-marquee').addEventListener('click', () => {
  document.getElementById('hero-marquee').classList.toggle('paused');
});

function fillDesktopSummary(project) {
  document.getElementById('d-category').textContent = project.category || '';
  document.getElementById('d-title').textContent = project.title || '';

  const desc = document.getElementById('d-desc');
  desc.textContent = project.description || '';
  desc.style.display = project.description ? '' : 'none';

  const credits = document.getElementById('d-credits');
  credits.textContent = project.credits || '';
  credits.style.display = project.credits ? '' : 'none';
}

// ── LOAD ─────────────────────────────────────────────────────────────
async function load() {
  if (!id) { showNotFound(); return; }
  const { data, error } = await sb.from('projects')
    .select('*, profiles(display_name, handle)')
    .eq('id', id)
    .eq('display_mode', 'gallery') // this page only ever renders a gallery-mode project
    .maybeSingle();
  if (error || !data) { showNotFound(); return; }
  render(data);
}
load();
</script>
</body>
</html>
