<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Study — Amelia Arabe</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20fill-rule%3D%22evenodd%22%20fill%3D%22%23F5B942%22%20d%3D%22M16%2C3%20a13%2C13%200%201%2C0%200%2C26%20a13%2C13%200%201%2C0%200%2C-26%20Z%20M20%2C6%20a10%2C10%200%201%2C0%200%2C20%20a10%2C10%200%201%2C0%200%2C-20%20Z%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
<script src="../../shared/app-shell.js"></script>
<style>
:root {
  --black:       #0A0A0A;
  --black-mid:   #1A1A1A;
  --black-soft:  #2A2A2A;
  --gray-dark:   #555555;
  --gray-mid:    #999999;
  --gray-light:  #CCCCCC;
  --gray-faint:  #E8E8E8;
  --white:       #FAFAFA;
  --pure-white:  #FFFFFF;
  --font-display: "Cormorant Garamond", Georgia, serif;
  --font-body:    "Inter", sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  color: var(--black);
  background: var(--white);
  opacity: 0;
  transition: opacity 0.2s ease;
}
body.cs-loaded { opacity: 1; }

.cs-back {
  position: absolute;
  top: 24px; left: 24px;
  z-index: 2;
  font-family: var(--font-body);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--pure-white);
  text-decoration: none;
}

.cs-position {
  position: absolute;
  top: 24px; right: 24px;
  z-index: 2;
  font-family: var(--font-body);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.75);
  display: none;
}

.cs-nav-arrow {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  z-index: 3;
  width: 40px;
  height: 40px;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.92);
  border: none;
  cursor: pointer;
  font-family: var(--font-display);
  font-size: 18px;
  color: var(--black);
  text-decoration: none;
  transition: background 0.2s;
}
.cs-nav-arrow:hover { background: var(--pure-white); }
.cs-nav-prev { left: 16px; }
.cs-nav-next { right: 16px; }
@media (max-width: 640px) {
  .cs-nav-arrow { width: 34px; height: 34px; font-size: 16px; }
  .cs-nav-prev { left: 8px; }
  .cs-nav-next { right: 8px; }
}

.cs-hero {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 8;
  background-size: cover;
  background-position: center;
  background-color: var(--gray-faint);
  overflow: hidden;
}

.cs-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(10,10,10,0.85) 0%, rgba(10,10,10,0.45) 38%, rgba(10,10,10,0) 65%);
  pointer-events: none;
}

.cs-hero-content {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 40px 56px;
  z-index: 1;
}

.cs-category {
  font-family: var(--font-body);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.75);
  margin-bottom: 10px;
}

.cs-title {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: clamp(32px, 5vw, 56px);
  color: var(--pure-white);
  line-height: 1.05;
}

.cs-hero-subhead {
  font-family: var(--font-body);
  font-weight: 300;
  font-size: 14px;
  line-height: 1.6;
  color: rgba(255,255,255,0.85);
  max-width: 560px;
  margin-top: 12px;
  display: none;
}

.cs-body {
  max-width: 760px;
  margin: 0 auto;
  padding: 48px 24px 96px;
}

.cs-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 32px;
}
.cs-tag {
  font-family: var(--font-body);
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  border: 0.5px solid var(--gray-light);
  color: var(--gray-mid);
  padding: 3px 8px;
}
/* Music/Performance get a softer, pill-shaped tag — everyone else (and
   the default when ?from= is absent, e.g. archive-stack/bulletin-board's
   hardcoded links) keeps the sharp rectangle above. See ROLE_CONFIG. */
body.cs-round-tags .cs-tag { padding: 3px 10px; border-radius: 999px; }

.cs-section { margin-bottom: 40px; }
.cs-section-label {
  font-family: var(--font-body);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gray-mid);
  margin-bottom: 10px;
}
.cs-section-text {
  font-family: var(--font-body);
  font-weight: 300;
  font-size: 15px;
  color: var(--black-mid);
  line-height: 1.85;
}

.cs-gallery {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 2px;
  margin-bottom: 40px;
}
.cs-gallery-item {
  aspect-ratio: 4 / 3;
  background-size: cover;
  background-position: center;
  background-color: var(--gray-faint);
}

.cs-cta { margin-top: 8px; }
.cs-link {
  font-family: var(--font-body);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--black);
  border-bottom: 1px solid var(--black);
  padding-bottom: 2px;
  text-decoration: none;
  display: inline-block;
}
.cs-link-inactive {
  font-family: var(--font-body);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gray-mid);
  display: inline-block;
}

.cs-error {
  padding: 96px 24px;
  text-align: center;
  font-family: var(--font-body);
  font-weight: 300;
  color: var(--gray-mid);
}
.cs-error a { color: var(--black); }

.cs-meta {
  display: none;
  flex-wrap: wrap;
  gap: 24px;
  margin-bottom: 40px;
  padding-top: 24px;
  border-top: 0.5px solid var(--gray-faint);
}
.cs-meta-item { display: none; min-width: 100px; }
.cs-meta-label {
  font-family: var(--font-body);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gray-mid);
  margin-bottom: 4px;
}
.cs-meta-value {
  font-family: var(--font-body);
  font-weight: 300;
  font-size: 13px;
  color: var(--black-mid);
  line-height: 1.5;
}

@media (max-width: 640px) {
  .cs-hero-content { padding: 24px; }
  .cs-body { padding: 32px 20px 64px; }
}
</style>
</head>
<body>

<div id="cs-root">
  <a class="cs-back" href="../amelia-arabe-portfolio.html">&larr; Back to Portfolio</a>
  <div class="cs-position" id="cs-position"></div>
  <a class="cs-nav-arrow cs-nav-prev" id="cs-nav-prev" href="#" aria-label="Previous project">&larr;</a>
  <a class="cs-nav-arrow cs-nav-next" id="cs-nav-next" href="#" aria-label="Next project">&rarr;</a>

  <div class="cs-hero" id="cs-hero">
    <div class="cs-scrim"></div>
    <div class="cs-hero-content">
      <div class="cs-category" id="cs-category"></div>
      <div class="cs-title" id="cs-title"></div>
      <div class="cs-hero-subhead" id="cs-hero-subhead"></div>
    </div>
  </div>

  <div class="cs-body">
    <div class="cs-tags" id="cs-tags"></div>

    <div class="cs-section" id="cs-problem-wrap">
      <div class="cs-section-label">The Problem</div>
      <div class="cs-section-text" id="cs-problem-text"></div>
    </div>

    <div class="cs-section" id="cs-process-wrap">
      <div class="cs-section-label">The Process</div>
      <div class="cs-section-text" id="cs-process-text"></div>
    </div>

    <div class="cs-section" id="cs-outcome-wrap">
      <div class="cs-section-label">The Outcome</div>
      <div class="cs-section-text" id="cs-outcome-text"></div>
    </div>

    <div class="cs-gallery" id="cs-gallery" style="display:none;"></div>

    <div class="cs-section" id="cs-credits-wrap">
      <div class="cs-section-label">Credits</div>
      <div class="cs-section-text" id="cs-credits-text"></div>
    </div>

    <div class="cs-meta" id="cs-meta">
      <div class="cs-meta-item" id="cs-meta-role-wrap"><div class="cs-meta-label">Role</div><div class="cs-meta-value" id="cs-meta-role"></div></div>
      <div class="cs-meta-item" id="cs-meta-team-wrap"><div class="cs-meta-label">Team</div><div class="cs-meta-value" id="cs-meta-team"></div></div>
      <div class="cs-meta-item" id="cs-meta-status-wrap"><div class="cs-meta-label">Status</div><div class="cs-meta-value" id="cs-meta-status"></div></div>
      <div class="cs-meta-item" id="cs-meta-year-wrap"><div class="cs-meta-label">Year</div><div class="cs-meta-value" id="cs-meta-year"></div></div>
    </div>

    <div class="cs-cta" id="cs-cta"></div>
  </div>
</div>

<script>
// sb/esc come from shared/app-shell.js

// Replaces case-study-{technical,creative,music,performance}.html — those
// four files were 95%+ identical (see the 2026-08-25 site review). The
// only real differences were the CTA label and whether tags render as
// sharp rectangles or soft pills, both keyed off the role (?from=) this
// case study was opened from. fine-art never used this template (painter
// routes through collection.html/artwork.html instead).
const ROLE_CONFIG = {
  engineer: { ctaLabel: 'View Live Project', roundTags: false },
  inventor: { ctaLabel: 'View Project',      roundTags: false },
  cellist:  { ctaLabel: 'Book a Performance', roundTags: true },
  actress:  { ctaLabel: 'Request Portfolio',  roundTags: true },
};

const id = new URLSearchParams(window.location.search).get('id');
// which career toggle this project was opened from — carried through so
// "Back to Portfolio" reopens the same toggle instead of resetting to
// About, and so we know which ROLE_CONFIG to render with.
const from = new URLSearchParams(window.location.search).get('from');
// set when this project was reached via an isolated share link (see
// buildCaseStudyUrl()/applyShareParam() in amelia-arabe-portfolio.html) —
// "Back to Portfolio" needs to return to that same isolated view (?share=),
// not the hash route (#), which shows the full switcher and every hat.
const isolated = new URLSearchParams(window.location.search).get('share') === '1';
const backHref = from ? '../amelia-arabe-portfolio.html' + (isolated ? `?share=${from}` : `#${from}`) : null;
if (backHref) {
  const backLink = document.querySelector('.cs-back');
  if (backLink) backLink.href = backHref;
}

// Once the project's owner is known (render(), below), the back-link needs
// their handle too — otherwise a second Muse's project would send visitors
// back to Amelia's portfolio instead of hers. Default handle is omitted so
// every existing link (none of which carry a handle) is untouched.
function backHrefWithHandle(handle) {
  if (!backHref || !handle || handle === 'amelia-arabe') return backHref;
  const sep = backHref.includes('?') ? '&' : '?';
  const hashIdx = backHref.indexOf('#');
  if (hashIdx === -1) return `${backHref}${sep}u=${encodeURIComponent(handle)}`;
  return `${backHref.slice(0, hashIdx)}${sep}u=${encodeURIComponent(handle)}${backHref.slice(hashIdx)}`;
}

const cfg = ROLE_CONFIG[from] || ROLE_CONFIG.engineer;
const CTA_LABEL = cfg.ctaLabel;
if (cfg.roundTags) document.body.classList.add('cs-round-tags');

// image_url is stored relative to the repo root — this file lives two
// levels down (app/templates/), so local paths need '../../' prepended.
// External URLs pass through unchanged.
function resolveImageUrl(url) {
  if (!url) return '';
  return /^https?:\/\//.test(url) ? url : '../../' + url;
}

function toggleSection(wrapId, textId, value) {
  const wrap = document.getElementById(wrapId);
  if (value) {
    wrap.style.display = '';
    document.getElementById(textId).textContent = value;
  } else {
    wrap.style.display = 'none';
  }
}

function showError() {
  document.getElementById('cs-root').innerHTML =
    '<div class="cs-error">Project not found.<br><a href="../amelia-arabe-portfolio.html" id="cs-error-back">&larr; Back to Portfolio</a></div>';
  if (backHref) document.getElementById('cs-error-back').href = backHref;
}

function render(p) {
  const owner = p.profiles || {};
  document.title = p.title + ' — ' + (owner.display_name || 'Amelia Arabe');
  const backLink = document.querySelector('.cs-back');
  if (backLink && backHref) backLink.href = backHrefWithHandle(owner.handle);

  const hero = document.getElementById('cs-hero');
  if (p.image_url) hero.style.backgroundImage = `url(${resolveImageUrl(p.image_url)})`;

  document.getElementById('cs-category').textContent = p.category || '';
  document.getElementById('cs-title').textContent = p.title;

  const subhead = document.getElementById('cs-hero-subhead');
  if (p.description) { subhead.textContent = p.description; subhead.style.display = ''; }
  else { subhead.style.display = 'none'; }

  const tagsWrap = document.getElementById('cs-tags');
  tagsWrap.innerHTML = (p.tags || []).map(t => `<span class="cs-tag">${t}</span>`).join('');

  toggleSection('cs-problem-wrap', 'cs-problem-text', p.case_problem);
  toggleSection('cs-process-wrap', 'cs-process-text', p.case_process);
  toggleSection('cs-outcome-wrap', 'cs-outcome-text', p.case_outcome);
  toggleSection('cs-credits-wrap', 'cs-credits-text', p.credits);

  const metaFields = [
    ['role', 'cs-meta-role-wrap', 'cs-meta-role'],
    ['team', 'cs-meta-team-wrap', 'cs-meta-team'],
    ['status', 'cs-meta-status-wrap', 'cs-meta-status'],
    ['year', 'cs-meta-year-wrap', 'cs-meta-year'],
  ];
  let hasMeta = false;
  metaFields.forEach(([key, wrapId, valId]) => {
    const wrap = document.getElementById(wrapId);
    if (p[key]) {
      wrap.style.display = '';
      document.getElementById(valId).textContent = p[key];
      hasMeta = true;
    } else {
      wrap.style.display = 'none';
    }
  });
  document.getElementById('cs-meta').style.display = hasMeta ? 'flex' : 'none';

  const galleryWrap = document.getElementById('cs-gallery');
  if (p.gallery_urls && p.gallery_urls.length) {
    galleryWrap.style.display = '';
    galleryWrap.innerHTML = p.gallery_urls.map(url => `<div class="cs-gallery-item" style="background-image:url(${resolveImageUrl(url)})"></div>`).join('');
  }

  const ctaWrap = document.getElementById('cs-cta');
  if (p.url) {
    ctaWrap.innerHTML = `<a class="cs-link" href="${p.url}" target="_blank" rel="noopener">${CTA_LABEL}</a>`;
  } else if (p.badge) {
    ctaWrap.innerHTML = `<span class="cs-link-inactive">${p.badge}</span>`;
  }
}

// prev/next navigation between sibling projects (same toggle_id, ordered by
// sort_order) — arrows, keyboard, and touch-swipe all funnel through goTo(),
// which fades the page out before swapping ?id= on this same template file.
function setupNav(p) {
  const prevBtn = document.getElementById('cs-nav-prev');
  const nextBtn = document.getElementById('cs-nav-next');

  function goTo(targetId) {
    document.body.classList.remove('cs-loaded');
    const params = new URLSearchParams(window.location.search);
    params.set('id', targetId);
    setTimeout(() => { window.location.href = '?' + params.toString(); }, 180);
  }

  if (!p.toggle_id) return;
  sb.from('projects').select('id,category').eq('toggle_id', p.toggle_id).order('sort_order')
    .then(({ data: siblings }) => {
      if (!siblings || siblings.length < 2) return;
      const idx = siblings.findIndex(s => s.id === p.id);
      if (idx === -1) return;

      document.getElementById('cs-position').textContent =
        `${p.category || ''} — ${idx + 1} / ${siblings.length}`.trim();
      document.getElementById('cs-position').style.display = '';

      const prevId = idx > 0 ? siblings[idx - 1].id : null;
      const nextId = idx < siblings.length - 1 ? siblings[idx + 1].id : null;

      if (prevId) {
        prevBtn.style.display = 'flex';
        prevBtn.onclick = e => { e.preventDefault(); goTo(prevId); };
      }
      if (nextId) {
        nextBtn.style.display = 'flex';
        nextBtn.onclick = e => { e.preventDefault(); goTo(nextId); };
      }

      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft' && prevId) goTo(prevId);
        if (e.key === 'ArrowRight' && nextId) goTo(nextId);
      });

      let touchStartX = null;
      document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
      document.addEventListener('touchend', e => {
        if (touchStartX === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        touchStartX = null;
        if (Math.abs(dx) < 60) return;
        if (dx > 0 && prevId) goTo(prevId);
        else if (dx < 0 && nextId) goTo(nextId);
      }, { passive: true });
    });
}

async function load() {
  requestAnimationFrame(() => document.body.classList.add('cs-loaded'));
  if (!id) { showError(); return; }
  const { data, error } = await sb.from('projects').select('*, profiles(display_name,handle)').eq('id', id).maybeSingle();
  if (error || !data) { showError(); return; }
  render(data);
  setupNav(data);
}

document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
