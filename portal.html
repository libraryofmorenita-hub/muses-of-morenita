<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --black:      #0A0A0A;
  --gray-dark:  #555555;
  --gray-mid:   #999999;
  --gray-light: #CCCCCC;
  --gray-faint: #E8E8E8;
  --white:      #FAFAFA;
  --pure-white: #FFFFFF;
  --success:    #5F7052;
  --font-display: "Cormorant Garamond", Georgia, serif;
  --font-body:    "Inter", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-body); font-weight: 300; background: var(--white); color: var(--black);
  -webkit-font-smoothing: antialiased; min-height: 100vh;
}
.wrap { max-width: 640px; margin: 0 auto; padding: 64px 28px 100px; }

.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--gray-mid); }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 40px; margin-top: 10px; line-height: 1.1; }
.tagline { margin-top: 12px; font-size: 15px; color: var(--gray-dark); line-height: 1.6; max-width: 46ch; }

.status-pill {
  display: inline-block; margin-top: 22px; padding: 5px 14px; border: 1px solid var(--gray-faint);
  font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--gray-dark);
}
.status-pill.active { border-color: var(--success); color: var(--success); }

.section { margin-top: 56px; }
.section-label {
  font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--gray-mid);
  padding-bottom: 12px; border-bottom: 1px solid var(--gray-faint);
}

.milestone-list { margin-top: 4px; }
.milestone {
  display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--gray-faint);
  font-size: 14px; font-weight: 300;
}
.milestone:last-child { border-bottom: none; }
.milestone .mark {
  width: 18px; height: 18px; border: 1px solid var(--gray-light); border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--pure-white);
}
.milestone.done .mark { background: var(--black); border-color: var(--black); }
.milestone.done .label { color: var(--gray-mid); text-decoration: line-through; }

.update {
  padding: 18px 0; border-bottom: 1px solid var(--gray-faint);
}
.update:last-child { border-bottom: none; }
.update .msg { font-size: 14px; font-weight: 300; line-height: 1.6; }
.update .date { margin-top: 6px; font-size: 11px; color: var(--gray-mid); letter-spacing: .04em; text-transform: uppercase; }

.empty { padding: 24px 0; font-size: 13px; color: var(--gray-mid); font-style: italic; }

.state-message { padding: 120px 28px; text-align: center; }
.state-message h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; }
.state-message p { margin-top: 10px; font-size: 14px; color: var(--gray-mid); }

footer { margin-top: 90px; padding-top: 20px; border-top: 1px solid var(--gray-faint); font-size: 11px; color: var(--gray-mid); text-align: center; }
</style>
</head>
<body>

<div id="root">
  <!-- populated by load() below -->
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
<script src="shared/app-shell.js"></script>
<script>
// A client-facing, read-only project status page. No account, no login —
// the link itself (?token=<project's portal_token>) is the access control,
// resolved entirely through get_portal_project(), a SECURITY DEFINER RPC
// that returns only the one project a token names (never the base tables
// directly — see the "Structural rebuild" plan, Phase 2, for why this
// replaced the old client_portals table + magic-link flow).
//
// This intentionally does not include contracts, invoices, e-signature, or
// intake forms — those were part of the previous version of this page
// (built for one specific client, Kairos) and are a separate later pass,
// not core project tracking.

const token = new URLSearchParams(window.location.search).get('token');

function renderNotFound() {
  document.getElementById('root').innerHTML = `
    <div class="state-message">
      <h2>Project not found</h2>
      <p>This link may be out of date. Check with whoever sent it to you for a current one.</p>
    </div>`;
}

function renderProject(p) {
  const isActive = (p.status || '').toLowerCase() === 'active';
  const milestones = p.milestones || [];
  const updates = p.updates || [];

  const milestonesHtml = milestones.length
    ? milestones.map(m => `
        <div class="milestone ${m.done ? 'done' : ''}">
          <span class="mark">${m.done ? '✓' : ''}</span>
          <span class="label">${esc(m.label)}</span>
        </div>`).join('')
    : '<div class="empty">No milestones yet.</div>';

  const updatesHtml = updates.length
    ? updates.map(u => `
        <div class="update">
          <div class="msg">${esc(u.message)}</div>
          <div class="date">${esc(new Date(u.created_at).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }))}</div>
        </div>`).join('')
    : '<div class="empty">No updates posted yet.</div>';

  document.title = p.project_name + ' — Project Status';
  document.getElementById('root').innerHTML = `
    <div class="wrap">
      <div class="eyebrow">Project Status</div>
      <h1>${esc(p.project_name)}</h1>
      ${p.tagline ? `<div class="tagline">${esc(p.tagline)}</div>` : ''}
      <div class="status-pill ${isActive ? 'active' : ''}">${esc(p.status || 'Active')}</div>

      <div class="section">
        <div class="section-label">Milestones</div>
        <div class="milestone-list">${milestonesHtml}</div>
      </div>

      <div class="section">
        <div class="section-label">Updates</div>
        <div>${updatesHtml}</div>
      </div>

      <footer>A project portal on Muses of Morenita</footer>
    </div>`;
}

async function load() {
  if (!token) { renderNotFound(); return; }
  const { data, error } = await sb.rpc('get_portal_project', { p_token: token });
  const row = Array.isArray(data) ? data[0] : data;
  if (error || !row || !row.project_name) { renderNotFound(); return; }
  renderProject(row);
}

load();
</script>
</body>
</html>
